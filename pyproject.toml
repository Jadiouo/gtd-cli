[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtd-cli"
version = "3.0.0"
description = "A small Getting-Things-Done task manager for the terminal: inbox, next actions, contexts, weekly review"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jadiouo" }]
keywords = ["gtd", "todo", "cli", "productivity"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = ["click>=8.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gtd = "gtd_cli.main:cli"

[project.urls]
Homepage = "https://github.com/Jadiouo/gtd-cli"

[tool.setuptools.packages.find]
include = ["gtd_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
